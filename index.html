<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interaktywne drzewo genealogiczne rodu Majkowskich herbu Kościesza – od Majk-Tykiewek do Chodkowo Załogi.">
<title>Kierz Majkowskich</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="assets/site.css">
<style>
html,body{height:100%}
body{overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr}
main{position:relative;display:grid;grid-template-columns:1fr minmax(340px,440px);min-height:0}
#stage{position:relative;overflow:hidden;min-width:0;cursor:grab}
#stage:active{cursor:grabbing}
#stage svg{display:block;width:100%;height:100%}
.genhead text{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.genhead line{stroke:var(--line);stroke-dasharray:2 4}
.link{fill:none;stroke:var(--line);stroke-width:1.4}
.link.path{stroke:var(--moss);stroke-width:2.4}
.node rect{fill:var(--card);stroke:var(--line);stroke-width:1}
.node.path rect{stroke:var(--moss);fill:var(--moss-soft)}
.node.sel rect{stroke:var(--accent);stroke-width:2.2;fill:var(--accent-soft)}
.node.hit rect{stroke:var(--accent);stroke-dasharray:3 3}
.node text.nm{font-family:var(--display);font-size:14.5px;fill:var(--ink)}
.node text.yr{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.node .dot{fill:var(--accent)}
.node{cursor:pointer}
.tog circle{fill:var(--card);stroke:var(--muted)}
.tog text{font-family:var(--mono);font-size:11px;fill:var(--muted);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.tog{cursor:pointer}
.zoombar{position:absolute;left:16px;bottom:16px;display:flex;gap:6px}
.zoombar .btn{padding:6px 10px;box-shadow:var(--shadow)}
.legend{position:absolute;left:16px;top:12px;display:flex;gap:14px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--paper) 85%,transparent);padding:4px 8px;border-radius:6px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}

aside{border-left:1px solid var(--line);background:var(--card);overflow:auto;min-width:0}
.sheet{padding:20px 20px 40px;display:flex;flex-direction:column;gap:18px}
.crumbs{font-size:12px;color:var(--muted);line-height:1.7}
.crumbs button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.crumbs button:hover{color:var(--accent)}
.gen{font-family:var(--mono);font-size:12px;color:var(--moss);letter-spacing:.04em}
.who h2{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13.5px}
.facts dt{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding-top:2px}
.facts dd{margin:0;min-width:0}
.facts .mono{font-family:var(--mono);font-size:13px}
.note{font-family:var(--display);font-style:italic;font-size:16px;line-height:1.45;border-left:2px solid var(--moss);padding-left:12px;margin:0}
.feature{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--moss);background:var(--moss-soft);border-radius:8px;text-decoration:none;color:var(--ink)}
.feature img{width:56px;height:72px;object-fit:cover;border-radius:3px}
.feature b{font-family:var(--display);font-size:17px;display:block}
.feature span{font-size:12.5px;color:var(--muted)}
.sheet .prose{font-size:15.5px}
.more{align-self:flex-start}

/* stories view */
#stories{position:absolute;inset:0;background:var(--paper);overflow:auto;z-index:4}
.st-wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px;display:grid;grid-template-columns:240px 1fr;gap:32px}
.st-tabs{position:sticky;top:12px;align-self:start;display:flex;flex-direction:column;gap:2px}
.st-tabs h3{margin:0 0 8px 10px}
.st-tabs button{text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.st-tabs button:hover{background:var(--card)}
.st-tabs button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--moss)}
.st-tabs b{font-family:var(--display);font-size:15.5px;font-weight:600}
.st-tabs small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.st-body{min-width:0;display:flex;flex-direction:column;gap:16px}
.st-body h2{font-family:var(--display);font-size:34px;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
.st-body .lead{font-family:var(--display);font-style:italic;font-size:18px;color:var(--muted);margin:0;max-width:60ch}

@media (max-width:820px){
  main{grid-template-columns:1fr}
  aside{position:absolute;left:0;right:0;bottom:0;max-height:58%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;box-shadow:var(--shadow);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px)}
  aside.min{max-height:96px;overflow:hidden}
  .grab{display:block!important}
  .zoombar{bottom:auto;top:12px}
  .legend{display:none}
  .brand small{display:none}
  .st-wrap{grid-template-columns:1fr;gap:16px}
  .st-tabs{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .st-tabs h3{display:none}
  .st-tabs button{flex:0 0 auto;max-width:220px;border:1px solid var(--line);background:var(--card)}
  .st-body h2{font-size:28px}
}
.grab{display:none;width:44px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;border:0;padding:0;cursor:pointer}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="./">
      <h1>Kierz Majkowskich</h1>
      <small>Od Majk-Tykiewek do Chodkowo Załogi · herb Kościesza · opr. Lech Andrzej Majkowski</small>
    </a>
    <nav class="nav" aria-label="Widoki">
      <button id="navTree" class="on">Drzewo</button>
      <button id="navStories">Historie</button>
      <a href="jozef.html">o. Józef Majkowski</a>
    </nav>
    <div class="tools">
      <div class="search">
        <input id="q" type="search" placeholder="Szukaj osoby lub słowa w opisach…" autocomplete="off" aria-label="Szukaj">
        <div class="results" id="results" hidden></div>
      </div>
    </div>
  </header>
  <main>
    <div id="stage">
      <div class="legend"><span><i style="background:var(--moss-soft);border:1px solid var(--moss)"></i>linia przodków wybranej osoby</span><span><i style="background:var(--card);border:1px solid var(--line)"></i>kliknij osobę, by otworzyć kartę</span></div>
      <svg id="svg"></svg>
      <div class="zoombar">
        <button class="btn" id="zin" aria-label="Przybliż">+</button>
        <button class="btn" id="zout" aria-label="Oddal">−</button>
        <button class="btn" id="zfit">Całe drzewo</button>
        <button class="btn" id="zsel">Do wybranej</button>
      </div>
    </div>
    <aside id="panel"><button class="grab" id="grab" aria-label="Zwiń lub rozwiń kartę"></button><div class="sheet" id="sheet"></div></aside>
    <section id="stories" hidden aria-label="Historie rodzinne">
      <div class="st-wrap">
        <nav class="st-tabs" id="stTabs"><h3>Historie</h3></nav>
        <article class="st-body" id="stBody"></article>
      </div>
    </section>
  </main>
</div>

<script src="data.js"></script>
<script src="vendor/d3.min.js"></script>
<script src="assets/common.js"></script>
<script>
const F = window.FAMILY, esc = KM.esc;
const START_HASH = location.hash.slice(1);
const P = F.people, byId = {};
P.forEach(p => { byId[p.id] = p; p.kids = []; });
P.forEach(p => { if (p.parent) byId[p.parent].kids.push(p); });
const S = F.stories, storyById = {}; S.forEach(s => storyById[s.id] = s);
const ROMAN = ['', 'I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV','XVI'];
const yr = s => { const m = (s||'').match(/(1[5-9]\d\d|20[0-3]\d)/g); return m ? m[0] : ''; };
const place = s => (s||'').replace(/^(ok\.\s*)?[\d.–\-\s]+/, '').replace(/^(prawdopodobnie|między|przed|po)\b.*$/,'').trim();
function years(p){
  const b = yr(p.born), d = yr(p.died);
  const bq = /ok\.|prawdop/.test(p.born) ? 'ok. ' : '';
  if (b && d) return `${bq}${b} – ${d}`;
  if (b && p.died) return `${bq}${b} – †`;
  if (b) return `ur. ${bq}${b}`;
  if (d) return `† ${d}`;
  if (p.died) return '†';
  return '';
}
function ancestors(p){ const a=[]; let c=p; while(c){ a.unshift(c); c = c.parent ? byId[c.parent] : null; } return a; }
const JOZEF_ID = '73';

/* ---------- tree ---------- */
const NW = 214, NH = 46, DX = 56, DY = 272;
const root = d3.hierarchy(byId['1'], p => p.kids);
root.descendants().forEach(d => { d._kids = d.children; });
const svg = d3.select('#svg');
const gAll = svg.append('g');
const gHead = gAll.append('g').attr('class','genhead');
const gLink = gAll.append('g');
const gNode = gAll.append('g');
const zoom = d3.zoom().scaleExtent([0.15, 2.2]).on('zoom', e => gAll.attr('transform', e.transform));
svg.call(zoom).on('dblclick.zoom', null);
let selected = null, hits = new Set();
try { selected = byId[localStorage.getItem('kierz-sel')] || null; } catch(e) {}
if (!selected) selected = byId['65'];

function render(){
  d3.tree().nodeSize([DX, DY]).separation((a,b) => a.parent === b.parent ? 1 : 1.25)(root);
  const nodes = root.descendants(), links = root.links();
  const path = new Set(ancestors(selected).map(p => p.id));
  const [y0, y1] = d3.extent(nodes, d => d.x);
  const depths = d3.max(nodes, d => d.depth);
  gHead.selectAll('*').remove();
  for (let i = 0; i <= depths; i++){
    gHead.append('text').attr('x', i*DY).attr('y', y0 - 52).text(`${ROMAN[i+5]} pokolenie`);
    gHead.append('line').attr('x1', i*DY - 14).attr('x2', i*DY - 14).attr('y1', y0 - 40).attr('y2', y1 + 40);
  }
  gLink.selectAll('path').data(links, d => d.target.data.id).join('path')
    .attr('class', d => 'link' + (path.has(d.target.data.id) ? ' path' : ''))
    .attr('d', d => `M${d.source.y + NW},${d.source.x} C${d.source.y + NW + 30},${d.source.x} ${d.target.y - 40},${d.target.x} ${d.target.y},${d.target.x}`);
  const g = gNode.selectAll('g.node').data(nodes, d => d.data.id).join(enter => {
    const n = enter.append('g').attr('class','node').attr('tabindex', 0).attr('role','button');
    n.append('rect').attr('width', NW).attr('height', NH).attr('y', -NH/2).attr('rx', 5);
    n.append('text').attr('class','nm').attr('x', 12).attr('y', -3);
    n.append('text').attr('class','yr').attr('x', 12).attr('y', 14);
    n.append('circle').attr('class','dot').attr('r', 3).attr('cx', NW - 12).attr('cy', -12);
    const t = n.append('g').attr('class','tog').attr('transform', `translate(${NW},0)`);
    t.append('circle').attr('r', 9); t.append('text');
    n.on('click', (e, d) => select(d.data, false));
    n.on('keydown', (e, d) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(d.data, false); } });
    t.on('click', (e, d) => { e.stopPropagation(); d.children = d.children ? null : d._kids; render(); });
    return n;
  });
  g.attr('transform', d => `translate(${d.y},${d.x})`)
   .attr('class', d => 'node' + (path.has(d.data.id) ? ' path' : '') + (d.data === selected ? ' sel' : '') + (hits.has(d.data.id) ? ' hit' : ''))
   .attr('aria-label', d => `${d.data.name} ${years(d.data)}`);
  g.select('text.nm').text(d => trunc(d.data.name, 27));
  g.select('text.yr').text(d => { const pl = place(d.data.born); return years(d.data) + (pl ? ' · ' + trunc(pl, 18) : ''); });
  g.select('circle.dot').attr('display', d => (d.data.bio.length || d.data.imgs.length) ? null : 'none');
  g.select('g.tog').attr('display', d => d._kids ? null : 'none');
  g.select('g.tog text').text(d => d.children ? '−' : '+' + (d._kids ? d._kids.length : ''));
  g.select('g.tog circle').attr('r', d => d.children ? 9 : 12);
}
function trunc(s, n){ return s.length > n ? s.slice(0, n-1) + '…' : s; }
function expandTo(p){
  const anc = new Set(ancestors(p));
  for (let k = 0; k < 2; k++) root.each(d => { if (!d.children && d._kids && anc.has(d.data) && d.data !== p) d.children = d._kids; });
}
function nodeOf(p){ return root.descendants().find(d => d.data === p); }
function centerOn(p, scale){
  const n = nodeOf(p); if (!n) return;
  const el = document.getElementById('stage'), w = el.clientWidth, h = el.clientHeight;
  const k = scale || Math.max(d3.zoomTransform(svg.node()).k, 0.8);
  const cy = innerWidth <= 820 ? h * 0.25 : h / 2;
  svg.transition().duration(matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 550)
    .call(zoom.transform, d3.zoomIdentity.translate(w/2 - (n.y + NW/2)*k, cy - n.x*k).scale(k));
}
function fitAll(){
  const el = document.getElementById('stage'), w = el.clientWidth, h = el.clientHeight;
  const b = gAll.node().getBBox();
  const k = Math.min(w / (b.width + 80), h / (b.height + 80), 1);
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity.translate(w/2 - (b.x + b.width/2)*k, h/2 - (b.y + b.height/2)*k).scale(k));
}

/* ---------- person card ---------- */
function pagesLabel(pg){ if (!pg || !pg.length) return ''; const a = pg[0], b = pg[pg.length-1]; return a === b ? `str. ${a}` : `str. ${a}–${b}`; }
function select(p, center = true){
  showTree();
  selected = p;
  try { localStorage.setItem('kierz-sel', p.id); } catch(e) {}
  expandTo(p); render();
  if (center) centerOn(p);
  const anc = ancestors(p), par = p.parent ? byId[p.parent] : null;
  const sibs = par ? par.kids.filter(k => k !== p) : [];
  const crumbs = anc.slice(0, -1).map(a => `<button data-id="${a.id}">${esc(a.name.replace(/-Gradowaty/,''))}</button>`).join(' › ');
  const chip = k => `<button class="chip" data-id="${k.id}">${esc(k.name)}<span>${years(k)}</span></button>`;
  const bioLen = p.bio.join(' ').length;
  const s = document.getElementById('sheet');
  s.innerHTML = `
    ${crumbs ? `<div class="crumbs">${crumbs}</div>` : ''}
    <div class="who">
      <div class="gen">${ROMAN[p.gen]} pokolenie${/^\d+$/.test(p.id) ? ` · nr ${p.id} w „drabince”` : ''}</div>
      <h2>${esc(p.name)}</h2>
    </div>
    <dl class="facts">
      <dt>Urodz.</dt><dd class="mono">${p.born ? esc(p.born) : '<span class="empty">brak danych</span>'}</dd>
      ${p.died ? `<dt>Zm.</dt><dd class="mono">${esc(p.died)}</dd>` : ''}
      ${p.spouse ? `<dt>Małż.</dt><dd>${esc(p.spouse)}</dd>` : ''}
      ${par ? `<dt>Rodzic</dt><dd><button class="chip" data-id="${par.id}">${esc(par.name)}${par.spouse ? ' i ' + esc(par.spouse.replace(/^1\)\s*/,'').split(/,|;| 2\)| \(/)[0]) : ''}</button></dd>` : ''}
    </dl>
    ${p.note ? `<p class="note">${esc(p.note)}</p>` : ''}
    ${p.id === JOZEF_ID ? `<a class="feature" href="jozef.html"><img src="img/p076_01.webp" alt=""><div><b>Podstrona o. Józefa</b><span>Księga pamiątkowa, życiorys, zdjęcia, pieśni i nagrania</span></div></a>` : ''}
    ${p.stories.length ? `<section><h3>Historie z udziałem tej osoby</h3><div class="chips">${p.stories.map(id => `<button class="chip story" data-story="${id}">${esc(storyById[id].title)}</button>`).join('')}</div></section>` : ''}
    ${p.kids.length ? `<section><h3>Dzieci · ${p.kids.length}</h3><div class="chips">${p.kids.map(chip).join('')}</div></section>` : ''}
    ${sibs.length ? `<section><h3>Rodzeństwo · ${sibs.length}</h3><div class="chips">${sibs.map(chip).join('')}</div></section>` : ''}
    ${p.imgs.length ? `<section id="gal"><h3>Zdjęcia · ${p.imgs.length}</h3>${KM.gallery(p.imgs)}</section>` : ''}
    ${p.bio.length ? `<section><h3>Z opracowania · ${pagesLabel(p.pages)}</h3><div class="prose ${bioLen > 1800 ? 'clamped' : ''}" id="bio">${p.bio.map(t => `<p>${esc(t)}</p>`).join('')}</div>
      ${bioLen > 1800 ? `<button class="btn more" id="more">Czytaj całość</button>` : ''}</section>`
      : `<p class="empty">Opracowanie nie zawiera osobnego opisu tej osoby poza danymi w „drabince”.</p>`}
  `;
  s.querySelectorAll('[data-id]').forEach(b => b.onclick = () => select(byId[b.dataset.id]));
  s.querySelectorAll('[data-story]').forEach(b => b.onclick = () => openStory(b.dataset.story));
  const gal = document.getElementById('gal'); if (gal) KM.bindGallery(gal, p.imgs);
  const more = document.getElementById('more');
  if (more) more.onclick = () => { document.getElementById('bio').classList.remove('clamped'); more.remove(); };
  document.getElementById('panel').scrollTop = 0;
  document.getElementById('panel').classList.remove('min');
}
document.getElementById('grab').onclick = () => document.getElementById('panel').classList.toggle('min');

/* ---------- stories ---------- */
const stEl = document.getElementById('stories');
const tabs = document.getElementById('stTabs');
S.forEach(s => {
  const b = document.createElement('button');
  b.dataset.story = s.id;
  b.innerHTML = `<b>${esc(s.title)}</b><small>str. ${s.pages[0]}–${s.pages[1]}</small>`;
  b.onclick = () => openStory(s.id);
  tabs.appendChild(b);
});
function openStory(id){
  const s = storyById[id] || S[0];
  stEl.hidden = false;
  document.getElementById('navStories').classList.add('on');
  document.getElementById('navTree').classList.remove('on');
  tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.story === s.id));
  const r = KM.renderBlocks(s.blocks, 'str.');
  const body = document.getElementById('stBody');
  body.innerHTML = `
    <h2>${esc(s.title)}</h2>
    <p class="lead">${esc(s.lead)}</p>
    <p class="src">Z opracowania „KIERZ rodziny od Majk-Tykiewek do Chodkowo Załogi”, str. ${s.pages[0]}–${s.pages[1]}.</p>
    ${s.people.length ? `<div class="chips">${s.people.map(pid => `<button class="chip" data-id="${pid}">${esc(byId[pid].name)}<span>${years(byId[pid])}</span></button>`).join('')}${s.id === 'jozef' ? '<a class="chip story" href="jozef.html">Podstrona o. Józefa →</a>' : ''}</div>` : ''}
    <div class="prose">${r.html}</div>`;
  body.querySelectorAll('[data-id]').forEach(b => b.onclick = () => select(byId[b.dataset.id]));
  KM.bindFlow(body, r.imgs);
  stEl.scrollTop = 0;
  try { history.replaceState(null, '', '#' + s.id); } catch(e) {}
}
function showTree(){
  stEl.hidden = true;
  document.getElementById('navStories').classList.remove('on');
  document.getElementById('navTree').classList.add('on');
  try { if (location.hash) history.replaceState(null, '', location.pathname); } catch(e) {}
}
document.getElementById('navStories').onclick = () => openStory(S[0].id);
document.getElementById('navTree').onclick = showTree;

/* ---------- search ---------- */
const norm = s => (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
P.forEach(p => { p._n = norm(p.name + ' ' + (p.spouse||'')); p._raw = p.bio.join(' '); p._b = norm(p._raw); });
S.forEach(s => { s._raw = s.blocks.map(b => b.p || '').join(' '); s._b = norm(s._raw); });
const q = document.getElementById('q'), res = document.getElementById('results');
let resIdx = -1;
function snippet(raw, t){
  const ri = norm(raw).indexOf(t); if (ri < 0) return '';
  const a = Math.max(0, ri - 50), sn = raw.slice(a, ri + t.length + 60), k = ri - a;
  return `…${esc(sn.slice(0,k))}<mark>${esc(sn.slice(k,k+t.length))}</mark>${esc(sn.slice(k+t.length))}…`;
}
q.addEventListener('input', () => {
  const t = norm(q.value.trim());
  if (t.length < 2){ res.hidden = true; hits = new Set(); render(); return; }
  const words = t.split(/\s+/);
  const byName = P.filter(p => words.every(w => p._n.includes(w)));
  const byBio = P.filter(p => !byName.includes(p) && p._b.includes(t)).slice(0, 10);
  const inStories = S.filter(s => s._b.includes(t));
  hits = new Set(byName.map(p => p.id)); render();
  let html = '';
  if (byName.length) html += `<div class="sec">Osoby · ${byName.length}</div>` + byName.slice(0, 30).map(p => `<button data-id="${p.id}">${esc(p.name)}<span class="yr">${years(p)}</span></button>`).join('');
  if (inStories.length) html += `<div class="sec">W historiach</div>` + inStories.map(s => `<button data-story="${s.id}">${esc(s.title)}<span class="snip">${snippet(s._raw, t)}</span></button>`).join('');
  if (byBio.length) html += `<div class="sec">Wzmianki w opisach osób</div>` + byBio.map(p => `<button data-id="${p.id}">${esc(p.name)}<span class="yr">${years(p)}</span><span class="snip">${snippet(p._raw, t)}</span></button>`).join('');
  res.innerHTML = html || '<div class="sec">Brak wyników</div>';
  res.hidden = false; resIdx = -1;
  res.querySelectorAll('[data-id]').forEach(b => b.onclick = () => { res.hidden = true; select(byId[b.dataset.id]); });
  res.querySelectorAll('[data-story]').forEach(b => b.onclick = () => { res.hidden = true; openStory(b.dataset.story); });
});
q.addEventListener('keydown', e => {
  const items = [...res.querySelectorAll('button')];
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); resIdx = Math.max(0, Math.min(items.length-1, resIdx + (e.key === 'ArrowDown' ? 1 : -1))); items.forEach((b,i) => b.classList.toggle('on', i === resIdx)); }
  if (e.key === 'Enter' && items.length){ (items[resIdx] || items[0]).click(); }
  if (e.key === 'Escape'){ res.hidden = true; }
});
document.addEventListener('click', e => { if (!e.target.closest('.search')) res.hidden = true; });

document.getElementById('zin').onclick = () => svg.transition().call(zoom.scaleBy, 1.3);
document.getElementById('zout').onclick = () => svg.transition().call(zoom.scaleBy, 1/1.3);
document.getElementById('zfit').onclick = fitAll;
document.getElementById('zsel').onclick = () => centerOn(selected);

/* start */
render();
select(selected, false);
requestAnimationFrame(() => centerOn(selected, 0.85));
const h = START_HASH;
if (h === 'historie') openStory(S[0].id); else if (storyById[h]) openStory(h);
</script>
